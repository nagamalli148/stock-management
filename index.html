<!DOCTYPE html>
<html>
<head>
    <title>Device Stock Management</title>
    <style>
       table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align:   
 left;
        }

        th {
            background-color: #f2f2f2;   

        }

        #add-device-form {
            margin-bottom: 20px;
        }

        #remove-device-form {
            margin-bottom: 20px;
        }

        table th {
            width: 200px; /* Adjust the width as needed */
        }
    </style>
</head>
<body>
    <h1>Device Stock Management</h1>

    <form id="add-device-form">
        <label for="add-device-type">Add Device:</label>
        <select id="add-device-type">
            <option value="laptop">Laptop</option>
            <option value="tab">Tab</option>
            <option value="mobile">Mobile</option>
        </select>
        <input type="number" id="add-device-count" placeholder="Count">
        <button type="button" onclick="addDevice()">Add</button>
    </form>

    <form id="remove-device-form">
        <label for="remove-device-type">Remove Device:</label>
        <select id="remove-device-type">
            <option value="laptop">Laptop</option>
            <option value="tab">Tab</option>
            <option value="mobile">Mobile</option>
        </select>
        <input type="number" id="remove-device-count" placeholder="Count">
        <button type="button" onclick="removeDevice()">Remove</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Device</th>
                <th>Count</th>
            </tr>
        </thead>
        <tbody id="device-table"></tbody>
    </table>

    <script>
        const deviceStock = {
            laptop: 0,
            tab: 0,
            mobile: 0
        };

        function updateDeviceCount(deviceType, countChange) {
            deviceStock[deviceType] += countChange;
            updateTable();
        }

        function updateTable() {
            const deviceTableBody = document.getElementById("device-table");
            deviceTableBody.innerHTML = "";

            for (const deviceType in deviceStock) {
                const deviceCount = deviceStock[deviceType];
                const row = document.createElement("tr");
                row.innerHTML = `<td>${deviceType}</td><td>${deviceCount}</td>`;
                deviceTableBody.appendChild(row);
            }
        }

        function addDevice() {
            const deviceType = document.getElementById("add-device-type").value;
            const count = parseInt(document.getElementById("add-device-count").value);
            if (count > 0) {
                updateDeviceCount(deviceType, count);
            }
        }

        function removeDevice() {
            const deviceType = document.getElementById("remove-device-type").value;
            const count = parseInt(document.getElementById("remove-device-count").value);
            if (count > 0 && deviceStock[deviceType] >= count) {
                updateDeviceCount(deviceType, -count);
            }
        }

        updateTable();
    </script>
</body>
</html>
